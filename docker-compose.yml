
services:
  xray:
    image: "${XRAY_IMAGE:-ghcr.io/xtls/xray-core:26.6.1}"
    container_name: xray
    restart: unless-stopped
    command: ["run", "-config", "/etc/xray/config.json"]
    ports:
      - "${XRAY_PORT}:443/tcp"
      - "${XRAY_PORT_ALT:-8443}:8443/tcp"
      - "${XRAY_PORT_XHTTP:-9443}:9443/tcp"
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro
      - ./data:/etc/xray/data
    environment:
      - TZ=UTC
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
